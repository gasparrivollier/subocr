[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subocr"
version = "0.1.0"
description = "Extract burned-in subtitles from screen recordings with frame-exact timing"
requires-python = ">=3.12"
dependencies = [
  "av", "opencv-python-headless", "numpy", "rapidocr", "onnxruntime",
  "rapidfuzz", "pyyaml", "typer", "pillow", "PySide6-Essentials",
]

[project.optional-dependencies]
dev = ["pytest"]
build = ["pyinstaller"]

[project.scripts]
subocr = "subocr.cli:app"

[tool.setuptools]
packages = ["subocr", "subocr.app"]

[tool.setuptools.package-data]
subocr = ["assets/*"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = ["slow: needs OCR models / is slow"]
